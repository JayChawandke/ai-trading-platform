
version: '3.8'

services:

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://trading:trading@postgres:5432/trading
      - REDIS_URL=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml-service:8001
      - SECRET_KEY=${SECRET_KEY:-change-me}
    depends_on:
      - postgres
      - redis

  ml-service:
    build: ./ml_service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
      - REACT_APP_ML_SERVICE_URL=http://localhost:8001

volumes:
  pgdata:
